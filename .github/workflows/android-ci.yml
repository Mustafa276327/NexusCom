name: Build Nexus Companion APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kod indir
        uses: actions/checkout@v4

      - name: JDK kur
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Gradle wrapper olustur
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}

      - name: Gradle izni ver
        run: chmod +x ./gradlew

      - name: APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK boyutu goster
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
